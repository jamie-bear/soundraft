# Development stack — Vite dev server with HMR, bind mounts, pgadmin
# Usage: docker compose -f docker-compose.dev.yml up
services:
  # Frontend (Vite dev server with HMR)
  client:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "2950:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - api

  # Backend API (dev mode with --watch)
  api:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://music_user:music_pass@db:5432/music_db
      - JWT_SECRET=${JWT_SECRET:-dev_secret_key_change_in_prod}
      - S3_ENDPOINT=http://storage:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=tracks
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}

  # Database
  db:
    image: postgres:15-alpine
    ports:
      - "3486:5432"
    environment:
      - POSTGRES_USER=music_user
      - POSTGRES_PASSWORD=music_pass
      - POSTGRES_DB=music_db
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music_user -d music_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Object Storage (MinIO)
  storage:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ${UPLOADS_LOCATION:-minio_data}:/data

  # Database GUI (optional dev tool)
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  pg_data:
  minio_data:
  pgadmin_data:
