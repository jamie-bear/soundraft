services:
  # Backend API + Frontend (built into image)
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      additional_contexts:
        client-build: ./client
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://${DB_USER:-music_user}:${DB_PASSWORD:-music_pass}@db:5432/${DB_NAME:-music_db}
      - JWT_SECRET=${JWT_SECRET:-dev_secret_key_change_in_prod}
      - S3_ENDPOINT=http://storage:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-tracks}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend
      - backend

  # Database
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-music_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-music_pass}
      - POSTGRES_DB=${DB_NAME:-music_db}
    volumes:
      - ${PG_DATA_LOCATION:-pg_data}:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-music_user} -d ${DB_NAME:-music_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  # Object Storage (MinIO)
  storage:
    image: minio/minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}
    volumes:
      - ${UPLOADS_LOCATION:-minio_data}:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  # Optional reverse proxy with automatic HTTPS
  # Enable with: docker compose --profile proxy up -d
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    networks:
      - frontend

volumes:
  pg_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
