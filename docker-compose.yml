services:
  # Backend API + built frontend
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      additional_contexts:
        client-build: ./client
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://${DB_USER:-soundraft}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/${DB_NAME:-soundraft}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-tracks}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      RESOURCE_GRANT_TTL: ${RESOURCE_GRANT_TTL:-1h}
      AUDIO_UPLOAD_MAX_BYTES: ${AUDIO_UPLOAD_MAX_BYTES:-524288000}
      ATTACHMENT_UPLOAD_MAX_BYTES: ${ATTACHMENT_UPLOAD_MAX_BYTES:-524288000}
      COVER_UPLOAD_MAX_BYTES: ${COVER_UPLOAD_MAX_BYTES:-20971520}
      USER_STORAGE_QUOTA_BYTES: ${USER_STORAGE_QUOTA_BYTES:-21474836480}
      OBJECT_RECONCILE_INTERVAL_MS: ${OBJECT_RECONCILE_INTERVAL_MS:-30000}
      OBJECT_RECONCILE_BATCH_SIZE: ${OBJECT_RECONCILE_BATCH_SIZE:-20}
      OBJECT_STAGE_TTL_MINUTES: ${OBJECT_STAGE_TTL_MINUTES:-60}
      EXPORT_QUERY_TIMEOUT_MS: ${EXPORT_QUERY_TIMEOUT_MS:-30000}
      EXPORT_TIMEOUT_MS: ${EXPORT_TIMEOUT_MS:-900000}
      SEED_EXAMPLE_CONTENT: ${SEED_EXAMPLE_CONTENT:-false}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend
      - backend

  # PostgreSQL (application metadata)
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-soundraft}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-soundraft}
    volumes:
      # Keep DB files in a user-friendly host location by default.
      # You can also set PG_DATA_LOCATION=pg_data to use a Docker named volume.
      - ${PG_DATA_LOCATION:-./data/postgres}:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-soundraft} -d ${DB_NAME:-soundraft}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  # MinIO (audio uploads, covers, attachments)
  storage:
    image: minio/minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes:
      # Keep uploaded files in a user-friendly host location by default.
      # You can also set UPLOADS_LOCATION=minio_data to use a Docker named volume.
      - ${UPLOADS_LOCATION:-./data/storage}:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  # Optional reverse proxy with automatic HTTPS
  # Enable with: docker compose --profile proxy up -d
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA_LOCATION:-./data/caddy/data}:/data
      - ${CADDY_CONFIG_LOCATION:-./data/caddy/config}:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend

volumes:
  # Optional named volumes when *_LOCATION is set to these names.
  pg_data:
  minio_data:

networks:
  frontend:
  backend:
