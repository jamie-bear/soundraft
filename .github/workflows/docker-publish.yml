name: Docker

on:
  schedule:
    - cron: '30 1 * * *'
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: soundraft
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: soundraft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soundraft -d soundraft_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Test and audit server
        working-directory: ./server
        run: |
          npm test
          npm audit --audit-level=high

      - name: Start isolated MinIO
        run: |
          docker run -d --name soundraft-minio -p 127.0.0.1:9000:9000 -e MINIO_ROOT_USER=integration-key -e MINIO_ROOT_PASSWORD=integration-secret-only minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:9000/minio/health/ready && break; sleep 1; done
          curl -fsS http://127.0.0.1:9000/minio/health/ready

      - name: PostgreSQL migration and API integration tests
        working-directory: ./server
        env:
          TEST_REAL_STORAGE: 'true'
          RUN_BENCHMARK: 'true'
          TEST_S3_ENDPOINT: http://127.0.0.1:9000
          TEST_DATABASE_URL: postgresql://soundraft:test-password@localhost:5432/soundraft_test
          JWT_SECRET: ci-only-jwt-secret-with-at-least-thirty-two-characters
          S3_ACCESS_KEY: ci-access-key
          S3_SECRET_KEY: ci-secret-key-with-at-least-sixteen-characters
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: ci-admin-password-with-at-least-twelve-characters
        run: |
          npm run test:integration

      - name: Recovery preflight safety tests
        run: python3 scripts/test_restore_validation.py

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Build and audit client
        working-directory: ./client
        run: |
          npm run build
          npm run test:bundle
          npm audit --audit-level=high

      - name: Publish sanitized query-plan and timing artifacts
        uses: actions/upload-artifact@v4
        with:
          name: query-budgets
          path: docs/benchmarks/reliability.json
          if-no-files-found: error

  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - name: Real-service browser and recovery gate
        run: bash scripts/real-service-gate.sh

  build:
    runs-on: ubuntu-latest
    needs: [secrets, quality, recovery]
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          build-contexts: |
            client-build=./client
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
