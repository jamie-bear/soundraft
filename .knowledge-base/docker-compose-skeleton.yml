version: '3.8'

services:
  # Frontend Application
  client:
    image: node:18-alpine
    working_dir: /app
    # In production, this would build static files.
    # For dev, we run the dev server.
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "3000:5173" # Vite default
    volumes:
      - ./client:/app
    environment:
      - VITE_API_URL=http://localhost:8080/api

  # Backend API
  api:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app
    depends_on:
      - db
      - storage
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://music_user:music_pass@db:5432/music_db
      - JWT_SECRET=dev_secret_key_change_in_prod
      - S3_ENDPOINT=http://storage:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=tracks
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=admin

  # Database
  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=music_user
      - POSTGRES_PASSWORD=music_pass
      - POSTGRES_DB=music_db
    volumes:
      - pg_data:/var/lib/postgresql/data

  # Object Storage (MinIO)
  storage:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Web UI port
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data

  # Database Management GUI (Optional)
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pg_data:
  minio_data:
